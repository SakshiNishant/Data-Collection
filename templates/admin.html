/* Card */

}

/* Button */
.btn {
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    background:#25D366;
    color:white;
}

/* Logout */
.logout {
    position:fixed;
    top:10px;
    right:10px;
}
</style>
